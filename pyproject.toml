[project]
name = "burgerCodeEmployes"
version = "0.1.0"
description = "Lightweight employee management API for burger restaurants."
authors = [{name = "ALPHAMAN-0"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "sqlmodel>=0.0.22",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]